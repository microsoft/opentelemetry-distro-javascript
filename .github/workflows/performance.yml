name: Performance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark distro overhead
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERF_REGRESSION_THRESHOLD: "15"

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0

      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Install and build candidate
        working-directory: pr
        run: |
          npm ci
          npm run build

      - name: Install and build baseline
        working-directory: base
        run: |
          npm ci
          npm run build

      - name: Run alternating benchmark trials
        working-directory: pr
        run: |
          run_benchmark() {
            node --expose-gc perf/benchmark.mjs \
              --package-root "$1" \
              --iterations 100000 \
              --rounds 8 \
              --output "$2"
          }

          for trial in 1 2 3 4; do
            if (( trial % 2 == 1 )); then
              run_benchmark "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/base-$trial.json"
              run_benchmark "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/pr-$trial.json"
            else
              run_benchmark "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/pr-$trial.json"
              run_benchmark "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/base-$trial.json"
            fi
          done

      - name: Compare results
        working-directory: pr
        run: |
          node perf/compare.mjs \
            --baseline "$GITHUB_WORKSPACE/base-1.json" \
            --baseline "$GITHUB_WORKSPACE/base-2.json" \
            --baseline "$GITHUB_WORKSPACE/base-3.json" \
            --baseline "$GITHUB_WORKSPACE/base-4.json" \
            --candidate "$GITHUB_WORKSPACE/pr-1.json" \
            --candidate "$GITHUB_WORKSPACE/pr-2.json" \
            --candidate "$GITHUB_WORKSPACE/pr-3.json" \
            --candidate "$GITHUB_WORKSPACE/pr-4.json" \
            --threshold "$PERF_REGRESSION_THRESHOLD" \
            --output "$GITHUB_WORKSPACE/report.md"

      - name: Record PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > "$GITHUB_WORKSPACE/pr-number.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-results
          path: |
            base-*.json
            pr-*.json
            report.md
            pr-number.txt
          if-no-files-found: ignore
